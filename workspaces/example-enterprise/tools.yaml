tools:
  - name: jira.search_issues
    kind: rest
    scope: read
    connection: jira
    description: Search Jira issues with a JQL query.
    args_schema: {type: object, properties: {jql: {type: string}}, required: [jql]}
    rest:
      method: GET
      path: /rest/api/3/search/jql
      max_attempts: 3
  - name: jira.get_issue
    kind: rest
    scope: read
    connection: jira
    description: One Jira issue by key, for example IT-123.
    args_schema: {type: object, properties: {issue_key: {type: string}}, required: [issue_key]}
    rest:
      method: GET
      path: /rest/api/3/issue/{issue_key}
  - name: jira.create_issue
    kind: rest
    scope: write
    confirm_before_write: true
    connection: jira
    description: Create a Jira issue in a project.
    args_schema:
      type: object
      properties:
        fields: {type: object, description: Jira issue fields, including project, summary and issuetype.}
      required: [fields]
    rest:
      method: POST
      path: /rest/api/3/issue
      max_attempts: 1  # not idempotent: a retry could file the issue twice
  # A real notifier writes outside the process, so it is gated. (The mock in example-smb is not.)
  - name: notify.send
    kind: rest
    scope: write
    confirm_before_write: true
    connection: notify
    description: Send a message to a principal or the escalation contact.
    args_schema: {type: object, properties: {to: {type: string}, message: {type: string}}, required: [to, message]}
    rest:
      method: POST
      path: /messages
      max_attempts: 1
  - name: knowledge.search
    kind: knowledge
    scope: read
    description: Search the SharePoint-style libraries with ACL pre-filter.
    args_schema: {type: object, properties: {query: {type: string}}, required: [query]}
  - name: decide.ticket_priority
    kind: decision
    scope: read
    description: Ticket priority from impact and urgency (decisions/ticket_priority.yaml).
    args_schema: {type: object, properties: {impact: {type: string}, urgency: {type: string}}, required: [impact, urgency]}
  # The example HRIS is a deterministic in-process mock (tools/hris.py); a real pack would use
  # the `rest` kind over a Connection, as jira.* does.
  - name: hris.get_balance
    kind: python
    scope: read
    description: Leave balances by type for a principal.
    args_schema: {type: object, properties: {employee: {type: string}}, required: [employee]}
  - name: hris.submit_leave
    kind: python
    scope: write
    confirm_before_write: true
    description: Submit a leave request. Idempotent on (employee, request_id).
    args_schema:
      type: object
      properties:
        employee: {type: string}
        start: {type: string, format: date}
        end: {type: string, format: date}
        leave_type: {type: string}
        request_id: {type: string}
      required: [employee, start, end, leave_type, request_id]
  - name: decide.approval_routing
    kind: decision
    scope: read
    description: Approval tier from duration, leave type and role (decisions/approval_routing.yaml).
    args_schema: {type: object, properties: {duration_days: {type: integer}, leave_type: {type: string}, requester_role: {type: string}}, required: [duration_days, leave_type, requester_role]}
  - name: decide.access_routing
    kind: decision
    scope: read
    description: Approver tier from system and access level (decisions/access_routing.yaml).
    args_schema: {type: object, properties: {system: {type: string}, access_level: {type: string}}, required: [system, access_level]}
