[project]
name = "cograil"
version = "0.0.1"
description = "AI colleagues on process rails: Markdown runbooks executed with tool whitelists, approval gates and an audit trail."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Shashi (cognitive-builder)" }]
keywords = ["agents", "runbook", "workflow", "llm", "approval", "audit"]
dependencies = [
  "pydantic>=2.9",
  "httpx>=0.27",
  "jsonschema>=4.23",
  "anthropic>=0.40",
  "langgraph>=0.3",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "typer>=0.12",
  "pyyaml>=6.0",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pgvector>=0.3",
  "pypdf>=4.0",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
]

[project.optional-dependencies]
slack = ["slack-bolt>=1.21"]
oidc = ["authlib>=1.3", "itsdangerous>=2.2"]
mcp = ["fastmcp>=2.0"]

[project.scripts]
cograil = "cograil.cli:app"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-timeout>=2.3",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "types-jsonschema",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cograil"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Quiet, short and bounded by default; expensive kinds run only when named (ADR 0014).
addopts = [
  "-q",
  "--tb=short",
  "--maxfail=3",
  "--disable-warnings",
  "-m",
  "not integration and not e2e and not live",
]
timeout = 60
markers = [
  "integration: needs DATABASE_URL",
  "e2e: end to end through the CLI, API and store; GitHub runs these on every pull request",
  "live: calls a real model provider; releases only",
]
testpaths = ["tests"]
