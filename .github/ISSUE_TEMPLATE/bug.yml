name: Bug
description: Something behaves differently from the Product Plan or CLAUDE.md
title: "fix: <summary>"
labels: ["type:bug"]
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour, with the command and output
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
  - type: dropdown
    id: lane
    attributes:
      label: Lane
      description: Decides the model, the effort and where the work runs (CLAUDE.md, Lanes and Helpers). The matching label is added automatically.
      options:
        - "Lane 2: Sonnet 5.5, high (standard feature)"
        - "Lane 1: Opus 5.5, Ultracode (runner, gates, registry, access, evals, security)"
        - "Lane 3: GLM via @claude on GitHub (docs and small chores)"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [domain, parser, workspace, registry, runner, gates, store, providers, api, channels, knowledge, observability, cli, docs, ci]
