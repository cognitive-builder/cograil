name: Spike
description: A time-boxed investigation that ends in a written recommendation, not code
title: "spike: <question>"
labels: ["type:spike"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question to answer
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options to compare
  - type: dropdown
    id: lane
    attributes:
      label: Lane
      description: Decides the model, the effort and where the work runs (CLAUDE.md, Lanes and Helpers). The matching label is added automatically.
      options:
        - "Lane 2: Sonnet 5.5, high (standard feature)"
        - "Lane 1: Opus 5.5, Ultracode (runner, gates, registry, access, evals, security)"
        - "Lane 3: GLM via @claude on GitHub (docs and small chores)"
    validations:
      required: true
  - type: input
    id: timebox
    attributes:
      label: Time box
      placeholder: "2 hours"
  - type: textarea
    id: output
    attributes:
      label: Deliverable
      value: "A comment on this issue with a recommendation and, if a decision changes, a draft ADR."
