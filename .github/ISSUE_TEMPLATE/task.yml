name: Task
description: A unit of work for one Claude Code session
title: "<type>: <summary>"
labels: ["status:ready"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: One or two sentences. What exists after this is done?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Links to the Epic, ADRs, the Product Plan section, and anything the session must read first.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkboxes. Each one must be verifiable by a test, a command, or a screenshot.
      value: |
        - [ ] 
        - [ ] 
        - [ ] Tests added or updated
        - [ ] Docs updated if behaviour changed
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files likely touched
  - type: dropdown
    id: size
    attributes:
      label: Size
      options: ["S (under 1 hour)", "M (half a day)", "L (a day)"]
    validations:
      required: true
  - type: dropdown
    id: lane
    attributes:
      label: Lane
      description: Decides the model, the effort and where the work runs (CLAUDE.md, Lanes and Helpers).
      options:
        - "Lane 2: Sonnet 5.5, high (standard feature)"
        - "Lane 1: Opus 5.5, Ultracode (runner, gates, registry, access, evals, security)"
        - "Lane 3: GLM via @claude on GitHub (docs and small chores)"
    validations:
      required: true
  - type: dropdown
    id: testing
    attributes:
      label: Testing needed
      description: Proportionate testing (CLAUDE.md, Testing Budget). GitHub runs the full suite on every pull request.
      options:
        - "Tests for the touched modules (default)"
        - "Safety tests required (runner, gates, registry, access filtering)"
        - "End-to-end required (also add the needs:e2e label)"
        - "No tests (docs or config only)"
  - type: textarea
    id: out
    attributes:
      label: Out of scope
      description: What this issue must not do, so the session does not widen scope.
