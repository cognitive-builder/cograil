name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cograil
          POSTGRES_PASSWORD: cograil
          POSTGRES_DB: cograil
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cograil"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://cograil:cograil@localhost:5432/cograil
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-extras --dev
      - name: Lint
        run: uv run ruff format --check . && uv run ruff check .
      - name: Types
        run: uv run mypy src/
      # Sessions test in proportion (ADR 0014); GitHub runs everything, in full, for free.
      # --maxfail=0 lifts the session default of stopping after three failures.
      # pytest exits 5 when no tests match; that is fine until those tests exist.
      - name: Unit tests
        run: uv run pytest --maxfail=0
      - name: Migrations
        run: uv run alembic upgrade head
      - name: Integration tests
        run: uv run pytest -m integration --maxfail=0 || [ $? -eq 5 ]
      - name: End-to-end tests
        run: uv run pytest -m e2e --maxfail=0 || [ $? -eq 5 ]
      # A broken link or a strict-mode warning must fail the pull request, not the Pages deploy.
      - name: Docs
        run: uv run --only-group docs mkdocs build --strict

  # Every commit of the branch, history included, is scanned for credentials (issue #37).
  # A fake secret a test needs goes in .gitleaksignore by its fingerprint, with its reason.
  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.28.0
      GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" gitleaks
      - name: Scan for secrets
        run: ./gitleaks git . --redact --no-banner --verbose
