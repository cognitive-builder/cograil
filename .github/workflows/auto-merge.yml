name: Auto-merge

# Autopilot (ADR 0015): turn on GitHub auto-merge for pull requests from claude/* branches
# in this repo. GitHub then squash-merges by itself once required checks pass and
# conversations are resolved; this needs branch protection with required checks on main.
# A pull request labelled needs:human never auto-merges: a person merges it.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    if: |
      github.event.action != 'labeled' &&
      startsWith(github.head_ref, 'claude/') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      !contains(github.event.pull_request.labels.*.name, 'needs:human')
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge (squash)
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}

  hold:
    if: |
      github.event.action == 'labeled' &&
      github.event.label.name == 'needs:human' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Disable auto-merge
        run: gh pr merge --disable-auto "$PR_URL" || echo "auto-merge was not enabled"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
