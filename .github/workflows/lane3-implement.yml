name: Lane 3 implement

# Autopilot (ADR 0015): the dispatcher starts lane:3 tasks here with
#   gh workflow run lane3-implement.yml -f issue=N
# Routed at Z.AI's Anthropic-compatible endpoint (GLM) via the env block, like claude.yml.

on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to implement
        required: true
        type: number

concurrency:
  group: lane3-implement

jobs:
  implement:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      # The run executes scripts/check.sh, which shells out to `uv run`; install uv and the dev
      # environment the way ci.yml does (#83).
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-extras --dev
      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: https://api.z.ai/api/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ZAI_API_KEY }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: glm-5.3
          ANTHROPIC_DEFAULT_SONNET_MODEL: glm-5.3
          ANTHROPIC_DEFAULT_HAIKU_MODEL: glm-5.1
          API_TIMEOUT_MS: "3000000"
        with:
          anthropic_api_key: ${{ secrets.ZAI_API_KEY }}
          prompt: "Follow .claude/commands/implement-issue.md for GitHub issue #${{ inputs.issue }}."
          # implement-issue.md step 2 hands lane:3 issues to "@claude on GitHub": that is this run.
          # Edit and Write are granted so the run can change files (without them every write was denied, #9); gh is
          # limited to reading, commenting and opening issues and pull requests: no merge, repo or api (#63).
          claude_args: |
            --max-turns 70
            --append-system-prompt "You are the @claude GitHub runner for lane:3 issues: the lane check in implement-issue.md passes here, so continue with the task."
            --allowedTools "Edit,Write,Bash(git:*),Bash(scripts/check.sh:*),Bash(uv:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(grep:*),Bash(wc:*),Bash(diff:*),Bash(sort:*),Bash(mkdir:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue create:*),Bash(gh issue comment:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
